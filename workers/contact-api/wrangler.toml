name = "contact-api-afonso"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Custom domain (keep this hostname; bind it to THIS worker in Cloudflare):
# contact-api.afonsoferreira.adv.br
#
# After renaming from "contact-api":
# 1) npx wrangler deploy
# 2) npx wrangler secret put RESEND_API_KEY
# 3) Workers → contact-api-afonso → Settings → Domains & Routes
#    → add contact-api.afonsoferreira.adv.br
# 4) Delete the old Worker named "contact-api" (optional cleanup)

[vars]
SITE_URL = "https://afonsoferreira.adv.br"
FROM_NO_REPLY = "Afonso Ferreira <no-reply@afonsoferreira.adv.br>"
INBOX_TO = "contato@afonsoferreira.adv.br"
# Set after publishing a Resend dashboard template (optional; HTML fallback is primary):
# RESEND_AUTO_REPLY_TEMPLATE_ID = "contact-auto-reply"

# Secrets (set via CLI, never commit):
# npx wrangler secret put RESEND_API_KEY
