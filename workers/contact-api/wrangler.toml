name = "contact-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# After first deploy, bind a custom domain in the Cloudflare dashboard:
# contact-api.afonsoferreira.adv.br

[vars]
SITE_URL = "https://afonsoferreira.adv.br"
FROM_NO_REPLY = "Afonso Ferreira <no-reply@afonsoferreira.adv.br>"
INBOX_TO = "contato@afonsoferreira.adv.br"
# Set after publishing a Resend dashboard template (optional; HTML fallback is primary):
# RESEND_AUTO_REPLY_TEMPLATE_ID = "contact-auto-reply"

# Secrets (set via CLI, never commit):
# npx wrangler secret put RESEND_API_KEY
